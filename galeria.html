<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Fotos de destinos que te inspirarán a tu próxima aventura.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="galeria.html">
<div id="site-header"></div>
<main>
  <section class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=70')">
    <div class="container">
      <div class="crumbs"><a href="index.html">Inicio</a> / Galería</div>
      <h1>Inspírate con el mundo</h1>
      <p>Imágenes de los destinos que puedes visitar con nosotros. Haz clic para ampliar.</p>
    </div>
  </section>
    <section style="padding-top:3rem">
    <div class="container">
      <div class="chips" id="chips" style="justify-content:center"></div>
      <div class="masonry" id="masonry"></div>
    </div>
  </section>
  <section style="padding-top:0">
    <div class="container" style="text-align:center">
      <h2>¿Te enamoraste de alguno?</h2>
      <p style="color:var(--muted);margin-bottom:1.4rem">Conviértelo en tu próximo viaje.</p>
      <a class="btn" href="viajes.html">Ver paquetes</a>
    </div>
  </section>

<div class="overlay lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Visor de imágenes">

  <button class="lb-nav lb-prev" aria-label="Anterior">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" aria-label="Siguiente">›</button>
  <div class="cap" id="lbCap"></div>
</div>

<div id="site-footer"></div>
<script src="js/data.js"></script>
